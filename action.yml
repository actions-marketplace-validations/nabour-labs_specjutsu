name: specjutsu gate
description: Quality gate for AI-generated code. Every changed spec scenario needs a test that fails on the base and passes on the PR.
author: nabour-labs
branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: sj release to install (without the leading v).
    default: "0.4.0"
  base:
    description: Ref to compare against. Default is the pull request's base branch.
    default: ""
  comment:
    description: Post the result as a pull request comment, updated in place.
    default: "true"
  fail-on:
    description: "`gate` fails the step when the gate fails; `never` only reports."
    default: gate
  badge:
    description: On pushes to the default branch, publish badge.json to the sj-badge branch.
    default: "false"
  github-token:
    description: Token for downloading sj, commenting and pushing the badge.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install sj
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/install.sh" "${{ inputs.version }}"

    - name: Gate
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || inputs.base != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SJ_BASE: ${{ inputs.base != '' && inputs.base || format('origin/{0}', github.base_ref) }}
        SJ_COMMENT: ${{ inputs.comment }}
        SJ_FAIL_ON: ${{ inputs.fail-on }}
        SJ_PR: ${{ github.event.pull_request.number }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/comment.sh"

    - name: Badge
      if: inputs.badge == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/badge.sh"
