name: pages

# Publish the static site in site/ to GitHub Pages on every push to main that touches it.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/install.sh", "scripts/install.ps1", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The one-line installers are served from the site: …/specjutsu/install.sh and install.ps1.
      - run: cp scripts/install.sh scripts/install.ps1 site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
