[package]
name = "specjutsu"
description = "Master the art of the spec. Makes AI coding agents prove their work."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["spec", "tdd", "ai-agents", "spec-driven", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]

# `cargo binstall specjutsu` downloads the release archive instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sj-{ target }.tar.gz"
bin-dir = "sj-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/sj-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/sj-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "sj"
path = "src/main.rs"

[dependencies]
sj-core.workspace = true
sj-adapters.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
toml.workspace = true
